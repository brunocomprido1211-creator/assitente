services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: assistente }
    volumes: [dbdata:/var/lib/postgresql/data]
  app:
    build: .
    env_file: .env
    environment: { DATABASE_URL: postgres://postgres:postgres@db:5432/assistente }
    ports: ["3000:3000"]
    depends_on: [db]
volumes: { dbdata: {} }
