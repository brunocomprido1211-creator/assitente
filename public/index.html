<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6df6"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/icon-192.png"><title>Meu Assistente</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#2f6df6;--bd:#e3e6ec}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mut:#8f98a8;--bd:#2c333f}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
main{flex:1;min-height:0;display:flex;gap:12px;padding:12px;max-width:1100px;width:100%;margin:auto}
section{flex:1;min-height:0;display:none;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
body[data-tab=chat] #chat,body[data-tab=agenda] #agenda{display:flex}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.m{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap}
.u{background:var(--ac);color:#fff;align-self:flex-end}.a{background:var(--bg);align-self:flex-start}
form{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{padding:12px 15px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px}
#mic{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}#mic.on{background:#e5484d;color:#fff}
#agenda{overflow:auto}h3{margin:6px 0}
.up{display:flex;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}
.up b{min-width:92px;color:var(--ac)}.mut{color:var(--mut)}
.h{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.d{min-height:44px;border:1px solid var(--bd);border-radius:6px;padding:3px;font-size:11px}
.d.t{border-color:var(--ac)}.d.has{background:var(--ac);color:#fff}.w{color:var(--mut);font-size:11px;text-align:center}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:14px}
body[data-tab=chat] nav [data-t=chat],body[data-tab=agenda] nav [data-t=agenda]{color:var(--ac);font-weight:600}
@media(min-width:900px){section{display:flex!important}nav{display:none}#chat{flex:1}#agenda{flex:1.3}}
</style></head><body data-tab="chat"><main>
<section id="chat"><div id="log"></div>
<form id="f"><input id="t" placeholder="Fale ou escreva…" autocomplete="off" enterkeyhint="send">
<button type="button" id="mic" aria-label="Falar">🎤</button><button aria-label="Enviar">➤</button></form></section>
<section id="agenda"><h3>Próximos compromissos</h3><div id="up"></div>
<div class="h"><button id="p">‹</button><b id="mn"></b><button id="n">›</button></div><div class="g" id="g"></div></section>
</main><nav><button data-t="chat">💬 Conversa</button><button data-t="agenda">📅 Agenda</button></nav>
<script>
const $=id=>document.getElementById(id),log=$('log'),hist=[];let cur=new Date(),evs=[];
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>document.body.dataset.tab=b.dataset.t);
const add=(c,t)=>{const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.append(d);log.scrollTop=1e9};
add('a','Olá! Me diga seus compromissos com dia e hora, por texto ou voz 🎤, que eu agendo e te lembro no WhatsApp.');
async function send(v){add('u',v);add('a','…');const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:v,history:hist})});
 const {reply}=await r.json();log.lastChild.textContent=reply;hist.push({role:'user',content:v},{role:'assistant',content:reply});load()}
$('f').onsubmit=e=>{e.preventDefault();const v=$('t').value.trim();if(v){$('t').value='';send(v)}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$('mic').style.display='none';else{const rec=new SR();rec.lang='pt-BR';
 rec.onresult=e=>{$('t').value=e.results[0][0].transcript;$('f').requestSubmit()};
 rec.onend=()=>$('mic').classList.remove('on');
 $('mic').onclick=()=>{$('mic').classList.add('on');rec.start()}}
async function load(){evs=await (await fetch('/api/events')).json();draw()}
const tf={weekday:'short',day:'2-digit',month:'2-digit'};
function draw(){const y=cur.getFullYear(),m=cur.getMonth(),g=$('g'),now=new Date();
 const up=evs.filter(e=>new Date(e.starts_at)>=now).slice(0,8);
 $('up').innerHTML=up.map(e=>{const s=new Date(e.starts_at);return `<div class=up><b>${s.toLocaleDateString('pt-BR',tf)}<br>${s.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</b><span></span></div>`}).join('')||'<p class=mut>Nenhum compromisso futuro.</p>';
 [...$('up').querySelectorAll('span')].forEach((s,i)=>s.textContent=up[i].title);
 $('mn').textContent=cur.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 g.innerHTML=['D','S','T','Q','Q','S','S'].map(x=>`<div class=w>${x}</div>`).join('');
 for(let i=0;i<new Date(y,m,1).getDay();i++)g.innerHTML+='<div></div>';
 for(let d=1;d<=new Date(y,m+1,0).getDate();d++){
  const has=evs.some(e=>{const s=new Date(e.starts_at);return s.getFullYear()==y&&s.getMonth()==m&&s.getDate()==d});
  const t=y==now.getFullYear()&&m==now.getMonth()&&d==now.getDate();
  g.innerHTML+=`<div class="d${has?' has':''}${t?' t':''}">${d}</div>`}}
$('p').onclick=()=>{cur.setMonth(cur.getMonth()-1);draw()};$('n').onclick=()=>{cur.setMonth(cur.getMonth()+1);draw()};
load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
